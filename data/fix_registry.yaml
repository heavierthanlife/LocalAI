      而 N=2 时共有词 df=2、TF-IDF 无区分力，原 build_key_info_matches 交集非空
      即输出 → 6.7 表假警报 + file_scores 虚高。修复：DEFAULT_STOP_WORDS 扩容通用
      业务词；extract_keywords 加 _keep_nounish 词性过滤（丢动词/形容词）；build_key_info_matches
      改用与 key_sim 一致的预处理/模板去除文本，且仅当共有词≥3 且 Jaccard≥0.15 才输出。
