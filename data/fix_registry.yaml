# Fix Registry — invariant checks for every permanent bug fix.
# Each entry records WHAT must hold, WHY, and how to verify it.
#
# Add an entry here after fixing any bug that could silently regress.
# The pre-commit hook runs scripts/verify_fixes.py to check all entries.
#
# Bypass: SKIP_FIX_CHECK=1 git commit ...
# Check types: grep | grep_not | function_order

fixes:
  - id: FIX-2026-07-15-001
    title: "NVIDIA nemotron model requires nvidia/ prefix in all locations"
    severity: critical
    status: superseded
    status_note: >
      NVIDIA provider removed from llm_provider.py and llm_fallback.py.
      No nemotron references remain in the codebase. Fix no longer applicable.
    rationale: >
      The langchain_nvidia_ai_endpoints library's MODEL_TABLE uses full IDs
      like "nvidia/nemotron-3-ultra-550b-a55b". Without the prefix, the
      library cannot look up model capabilities and sends the raw name to
      the NVIDIA API, which returns 404 Not Found.
    checks:
      - type: grep_not
        file: app/services/llm_provider.py
        pattern: "nvidia/nemotron"
      - type: grep_not
        file: app/services/llm_fallback.py
        pattern: "nvidia/nemotron"

  - id: FIX-2026-07-15-002
    title: "Wiki frontend: ok() dict-spread means no .data wrapper — use .stats, .pages, .tree"
    severity: high
    status: superseded
    status_note: >
      Wiki frontend code refactored — statsData references no longer exist
      in app.js. The wiki now uses a different data access pattern. Fix
      no longer applicable in its original form.
    rationale: >
      ok() helper spreads dict keys to top-level JSON when data is a dict.
      The wiki endpoints return {success:true, pages:[], tree:{}} and
      {success:true, stats:{}} — no "data" envelope key exists. Frontend
      code referencing .data produces undefined, causing silent TypeError
      caught by empty catch block.
    checks:
      - type: grep_not
        file: static/js/app.js
        pattern: "statsData\\.data"

  - id: FIX-2026-07-15-003
    title: "_score_timeline_compliance must be defined BEFORE SCORING_FUNCTIONS dict"
    severity: critical
    rationale: >
      SCORING_FUNCTIONS is a module-level dict that references function
      objects at import time. _score_timeline_compliance was defined ~340
      lines below the dict, causing NameError on import. All audit
      endpoints returned 500. Must remain before line ~128.
    checks:
      - type: function_order
        file: app/services/audit_engine.py
        before: "_score_timeline_compliance"
        after: "SCORING_FUNCTIONS"

  - id: FIX-2026-07-15-004
    title: "NVIDIA nemotron model prefix in runtime_config.json"
    severity: critical
    rationale: >
      Active model and fallback chain entries in runtime_config.json must
      use the full "nvidia/nemotron-3-ultra-550b-a55b" ID. Without prefix,
      the model selection sends the wrong name to the NVIDIA API.
    checks:
      - type: grep_not
        file: data/runtime_config.json
        pattern: '"nemotron-3-ultra-550b-a55b"'

  - id: FIX-2026-07-15-005
    title: "project_recycle_bin table uses uploaded_by column, not user_id"
    severity: high
    rationale: >
      The recycle_bin_service permanently_delete_item() had hardcoded
      user_id column in queries. But project_recycle_bin has column
      "uploaded_by" instead. Queries failed with column-not-found error,
      silently swallowed by empty catch blocks in frontend.
    checks:
      - type: grep
        file: app/services/recycle_bin_service.py
        pattern: "'uploaded_by'"
      - type: grep
        file: app/services/recycle_bin_service.py
        pattern: "user_col"

  - id: FIX-2026-07-15-006
    title: "Recycle bin section data-attribute uses project_files not project"
    severity: high
    rationale: >
      Frontend empty/restore buttons sent source:"project" but backend
      empty_recycle_bin expects "project_files". Zero rows were deleted
      while the API returned success — user saw success toast but nothing
      happened. Individual delete had same column mismatch (FIX-005).
    checks:
      - type: grep
        file: templates/index.html
        pattern: 'data-section="project_files"'

  - id: FIX-2026-07-15-007
    title: "Duplicate conversation: SSE done event carries DB msg IDs, frontend updates poll cursor"
    severity: high
    rationale: >
      After streaming completes, _pollLastId was stale. The next poll cycle
      re-fetched and re-rendered the same messages, producing duplicates.
      Fix tracks msg IDs in the /send JSON response (user_message_id /
      assistant_message_id) and in chat.js via _lastKnownMessageId /
      _pollLastId cursor to skip already-rendered messages.
    checks:
      - type: grep
        file: app/routes/chat.py
        pattern: "user_message_id"
      - type: grep
        file: app/routes/chat.py
        pattern: "assistant_message_id"
      - type: grep
        file: static/js/chat.js
        pattern: "_pollLastId"
      - type: grep
        file: static/js/chat.js
        pattern: "_lastKnownMessageId"

  - id: FIX-2026-07-15-008
    title: "Admin sidebar extras visibility must not rely on sessionStorage race condition"
    severity: medium
    rationale: >
      verifyAuth() sets sessionStorage.isAdmin asynchronously, but
      DOMContentLoaded handler checks it synchronously — admins never
      saw the "清空全部数据" button on first page load. Fixed by
      setting sidebarAdminExtras.style.display directly inside
      verifyAuth() after isAdmin is confirmed.
    checks:
      - type: grep
        file: static/js/app.js
        pattern: "adminExtras\\.style\\.display.*is_admin"

  - id: FIX-2026-07-19-001
    title: "Verdict case mismatch: AI returns uppercase, comparison uses lowercase"
    severity: critical
    rationale: >
      _score_compliance_check compared verdict == 'pass' (lowercase) but AI
      returned "PASS" (uppercase). Pass count was always 0, scoring always 100%.
      Fix normalizes verdict to lowercase at the AI boundary and defines
      VERDICT_PASS/WARNING/VIOLATION/CRITICAL constants as single source of truth.
    checks:
      - type: grep
        file: app/services/compliance_prompts.py
        pattern: 'VERDICT_PASS = "PASS"'
      - type: grep
        file: app/services/compliance_checker.py
        pattern: '.get\("verdict".*\.lower\(\)'

  - id: FIX-2026-07-19-002
    title: "XSS via unsanitized report_html and diff_html in compliance.js"
    severity: critical
    rationale: >
      report_html (AI-generated) and diff_html (difflib HtmlDiff) were
      injected directly via innerHTML and += without sanitization. User
      document names in reports could contain XSS payloads. Fix adds
      DOMPurify CDN with onerror fallback and sanitizes before injection.
    checks:
      - type: grep
        file: templates/index.html
        pattern: "cdnjs\\.cloudflare\\.com/ajax/libs/dompurify"
      - type: grep
        file: static/js/compliance.js
        pattern: "_safeHTML"

  - id: FIX-2026-07-19-003
    title: "Tiptap Mark import from Editor static property unreliable in v2"
    severity: high
    status: superseded
    status_note: >
      tiptap-editor.js fully rewritten to use ESM dynamic imports
      (import() from esm.sh CDN). Editor and StarterKit are destructured
      from dynamic module imports. No Mark class needed in current code.
      The old static-import-based fix no longer applies.
    rationale: >
      Editor.Mark returned undefined in Tiptap v2 — Mark is a named export,
      not a static property of Editor. Fallback {} was truthy so if(!Mark)
      didn't trigger. Mark.create() would crash at runtime. Fix destructures
      Mark directly from the @tiptap/core import.
    checks:
      - type: grep
        file: static/js/tiptap-editor.js
        pattern: "import\\(.*@tiptap"

  - id: FIX-2026-07-19-004
    title: "Compliance._taskIds.extracted cleared on check, breaking editor"
    severity: high
    status: superseded
    status_note: >
      Code refactored to use a closure variable extractedRulesTaskId
      instead of reading _taskIds.extracted. The Tiptap editor now
      reads _taskIds[fn] (per-file IDs), not .extracted. The original
      bug path no longer exists.
    rationale: >
      The check button handler cleared Compliance._taskIds = {} destroying
      the .extracted key set by the extract-rules handler. The Tiptap editor
      reads _taskIds.extracted to get the rules task ID. Fix clears only
      per-file entries while preserving .extracted.
    checks:
      - type: grep
        file: static/js/compliance.js
        pattern: "_taskIds\\.extracted"

  - id: FIX-2026-07-19-005
    title: "Closed cursor passed to _compute_impact in law_monitor.py"
    severity: high
    rationale: >
      create_change_event called _compute_impact(cur if 'cur' in dir() else None)
      after the with conn.cursor() context exited. The dir() check always passed
      but the cursor was closed, causing InterfaceError. Fix moves _compute_impact
      call inside the with block while cursor is alive.
    checks:
      - type: grep
        file: app/services/law_monitor.py
        pattern: "_compute_impact[(]cur"
      - type: grep_not
        file: app/services/law_monitor.py
        pattern: "cur if .cur. in dir"

  - id: FIX-2026-08-28-001
    title: "/api/graph endpoints require login + project-membership check"
    severity: critical
    rationale: >
      All five /api/graph endpoints (collusion/compliance/law-impact/citation/types)
      had zero authentication, exposing bidder collusion and compliance data to
      anonymous callers and allowing any logged-in user to read any project's graph
      via arbitrary project_id (IDOR). Fix applies login_required to all routes and
      _require_project_access (admin bypass, others must be project members) on
      project_id-bearing routes.
    checks:
      - type: grep
        file: app/routes/graph.py
        pattern: "@login_required"
      - type: grep
        file: app/routes/graph.py
        pattern: "_require_project_access"

  - id: FIX-2026-08-28-002
    title: "Admin PIN fails closed in production (no weak 123456 default)"
    severity: high
    rationale: >
      When APP_ENV=production and neither ADMIN_PIN nor ADMIN_PASSWORD_HASH is set,
      create_app now raises instead of silently using the weak default 123456.
      Development keeps the 123456 fallback but logs a prominent warning.
      docker-compose sets APP_ENV=production and ADMIN_PIN default to empty so a
      missing PIN is never masked.
    checks:
      - type: grep
        file: app/__init__.py
        pattern: "app_env == .production. and not admin_pin"
      - type: grep
        file: docker-compose.yml
        pattern: "APP_ENV=production"

  - id: FIX-2026-08-28-003
    title: "credit_tasks must be Redis-backed (cross-worker task registry)"
    severity: high
    rationale: >
      The credit-check task registry lived in a process-local dict (app.globals.
      credit_tasks). Under multiple gunicorn workers the start POST could land on
      worker A while status/captcha/solve requests hit workers B/C/D, causing
      spurious 404s and CAPTCHA handshake deadlocks. Fix adds a Redis-backed
      registry (app/services/credit_task_registry.py) with graceful in-memory
      fallback, and migrates credit.py + cleanup_tasks.py to it.
    checks:
      - type: grep
        file: app/services/credit_task_registry.py
        pattern: "def set_task"
      - type: grep_not
        file: app/routes/credit.py
        pattern: "credit_tasks\\["

  - id: FIX-2026-08-28-004
    title: "Anonymous chat history must be PostgreSQL-backed (not JSON files)"
    severity: medium
    rationale: >
      Anonymous chat history was stored as one JSON file per thread under
      TEMP_ROOT with filelock read-modify-rewrite — non-atomic, data-loss on
      crash, and lock contention under streaming. Fix adds the anon_chat_messages
      JSONB table (database.py) and stores history via atomic UPSERT append
      (ON CONFLICT DO UPDATE ... messages || EXCLUDED.messages). Temp-file
      helpers (get_anon_temp_dir/cleanup_anon_temp) remain file-based.
    checks:
      - type: grep
        file: app/database.py
        pattern: "anon_chat_messages"
      - type: grep
        file: app/services/anonymous.py
        pattern: "ON CONFLICT .thread_id. DO UPDATE"
      - type: grep_not
        file: app/services/anonymous.py
        pattern: "FileLock"

  - id: FIX-2026-08-28-005
    title: "Prompt system — language consistency, guard dedup, dead-code removal"
    severity: medium
    rationale: >
      Auditor review found (a) English prompts in an all-Chinese system
      (JUDGE_PROMPT, STRUCTURED_PROMPT), (b) a generic "答疑助手" main prompt and a
      stale 'Test prompt' override in data/agent_prompt.json that had replaced the
      real default, (c) call_llm appending the anti-hallucination guard twice when
      the system_prompt already embeds it, and (d) four dead prompt constants.
      Fix: localize prompts to Chinese, upgrade the main prompt to a bidding-domain
      expert identity, restore the real default into agent_prompt.json, dedup the
      guard in call_llm, and delete dead code (BID_COMPARISON_SYSTEM,
      build_bid_analysis_prompt, WIKI_LINT_SYSTEM_PROMPT, WIKI_UPDATE_INDEX_PROMPT,
      _VL_CONSISTENCY_PROMPT).
    checks:
      - type: grep
        file: app/services/judge_review.py
        pattern: "你是一名严格的中文质量审查员"
      - type: grep_not
        file: app/services/judge_review.py
        pattern: "You are a quality reviewer"
      - type: grep
        file: app/services/llm_provider.py
        pattern: "guard not in system_prompt"
      - type: grep_not
        file: app/services/analysis_prompts.py
        pattern: "BID_COMPARISON_SYSTEM"
      - type: grep_not
        file: app/services/wiki_prompts.py
        pattern: "WIKI_LINT_SYSTEM_PROMPT"
      - type: grep_not
        file: app/services/prompt_safety.py
        pattern: "_VL_CONSISTENCY_PROMPT"

  - id: FIX-2026-08-28-006
    title: "Clearance results display in chat (toolbar tab area removed, no info loss)"
    severity: medium
    rationale: >
      Clearance (清标) results were shown in toolbar tabs that only covered 4 of
      the 10 report sections (九 image sampling and 十 audit supplement had no UI).
      Fix moves the results into the chat as an assistant answer (full 10 sections,
      collapsible, heat-matrix + clickable cells via scoped handlers), persists them
      as a CLEARANCE_REPORT-marked chat_messages row (reusing the existing DB
      transaction), adds thread-aware sidebar-click targeting via TaskBus thread_id
      metadata, and removes the toolbar results/tabs/download area (download stays in
      the sidebar task modal + chat bubble). Route preservation: 371/371.
    checks:
      - type: grep_not
        file: templates/index.html
        pattern: "clearanceResults"
      - type: grep
        file: app/services/clearance_engine.py
        pattern: "CLEARANCE_REPORT"
      - type: grep
        file: static/js/chat.js
        pattern: "CLEARANCE_REPORT"
      - type: grep
        file: static/js/app.js
        pattern: "_attachClearanceHandlers"
      - type: grep
        file: app/services/task_bus.py
        pattern: "def start.self, extra"

  - id: FIX-2026-08-28-007
    title: "Task status 404 race — queued pre-registration"
    severity: medium
    rationale: >
      After POST /clearance/run (or /document_analysis/analyze), the frontend
      immediately GETs /<route>/status/<task_id>. The route only enqueues a Celery
      task; task_meta is written when the worker calls bus.start(). In the
      enqueue→worker-start window TaskBus.get() returns None → 404 → noisy F12
      console errors ("Failed to load resource: 404", "提取 加载失败"). Fix: (B)
      add TaskBus.register_queued() and call it synchronously in both routes before
      send_task so status never 404s (worker start() upgrades queued→running);
      (A) frontend status pre-check tolerates a failed/404 fetch and falls through
      to SSE.
    checks:
      - type: grep
        file: app/services/task_bus.py
        pattern: "def register_queued"
      - type: grep
        file: app/routes/clearance.py
        pattern: "register_queued"
      - type: grep
        file: app/routes/document_analysis.py
        pattern: "register_queued"
      - type: grep
        file: static/js/app.js
        pattern: "statusCheck.ok"

  - id: FIX-2026-08-28-009
    title: "清标报告生产级升级 — 三节渲染/文本相似/开标信息表激活指标"
    severity: high
    rationale: >
      Reference template comparison showed the mimic report was a draft:
      (B1) section 三 (指标详情分析) never rendered any indicator tables —
      a `continue` placed before the render loop made it dead code; (B2) text
      similarity was always 0 because the TF-IDF matrix was never precomputed
      in the clearance path; (B3) suspected-unit indicator counts were booleans.
      Fix adds: per-indicator section-三 tables, TF-IDF wiring (with tender
      template removal), real indicator counts, a clearance_openinfo service that
      parses an uploaded 开标信息表 (Excel/CSV/JSON) and extracts 评审标准 from the
      tender, activating 11 OPEN_INFO + 3 TENDER indicators, quote accuracy via
      the 开标投标报价 column, and a preview_criteria endpoint for manual confirm.
      Platform/IP indicators stay as explicit skips (technically infeasible).
    checks:
      - type: grep
        file: app/services/document_analysis_svc.py
        pattern: "sub_no}、{ind"
      - type: grep
        file: app/services/clearance_engine.py
        pattern: "_precompute_tfidf_for_files"
      - type: grep
        file: app/services/clearance_openinfo.py
        pattern: "def compute_open_info_indicators"
      - type: grep
        file: app/routes/clearance.py
        pattern: "preview_criteria"
      - type: grep_not
        file: app/services/document_analysis_svc.py
        pattern: "int.triggered_count > 0"
