    title: "compose: DB_PASSWORD required (no insecure weak default)"
    severity: low
    rationale: "${DB_PASSWORD:-localai} silently started Postgres with a default password when .env was missing."
    checks:
      - type: grep_not
        file: docker-compose.yml
        pattern: "DB_PASSWORD:-localai"

  - id: FIX-2026-08-15-001
    title: "LLM tool-error and prompt-template text leaked into user-facing chat"
    severity: high
    rationale: >
      LangChain agents with tools [get_date, bocha_search] return raw ToolMessage
      content like 'Error: X is not a valid tool, try one of [...]' when the model
      hallucinates a tool name. Models without proper tool-calling support also
      echo the function-calling template ('Here is the JSON for a function call...').
      Both were streamed and stored verbatim. Fix has two halves: (1) backend
      sanitize_response() strips both patterns at the split_thinking_answer boundary
      for the stored/JSON copy; (2) frontend _sanitizeResponse() mirrors the patterns
      and cleans the LIVE SSE stream before rendering (the backend cannot filter
      per-chunk without breaking streaming).
    checks:
      - type: literal
        file: app/utils/helpers.py
        pattern: "def sanitize_response"
      - type: literal
        file: app/utils/helpers.py
        pattern: "return sanitize_response(thinking), sanitize_response(answer)"
      - type: literal
        file: static/js/chat.js
        pattern: "_sanitizeResponse(fullResponse)"

  - id: FIX-2026-08-15-003
    title: "Daily report insufficient-messages message was terse/unhelpful"
    severity: low
    rationale: >
      /my_daily_report correctly returns 400 when the user has fewer than 2 messages in
      24h, but the message '今日对话不足，至少需要2条问答' was reported as a broken button.
      Fix makes the message friendly and actionable so the toast explains what to do.
    checks:
      - type: literal
        file: app/routes/knowledge.py
        pattern: "先聊几句"

  - id: FIX-2026-08-15-002
    title: "/check_storage fired pre-login producing noisy 403 console errors"
    severity: medium
    rationale: >
      Frontend called /check_storage on every page load including pre-login, where the
      backend correctly returns 403 (consent not given). The 403s are expected behavior
      but produce console noise and were misreported as a bug. Fix: checkStorage() skips
      the fetch when sessionStorage has no username (i.e. not logged in) and ignores
      non-OK responses.
    checks:
      - type: literal
        file: static/js/app.js
        pattern: "sessionStorage.getItem('username')) return;"

  - id: FIX-2026-08-16-004
    title: "Pre-login fetches for templates/cases/notebook/projects fire 401/403 console noise"
    severity: low
    rationale: >
      Panels initialized on DOMContentLoaded and fetched /templates, /cases, /notebook,
      and /admin/projects regardless of login state, producing expected-but-noisy 401/403
      console errors. Fix: each loader skips the fetch when sessionStorage has no username
      and renders a login prompt instead.
    checks:
      - type: literal
        file: static/js/cases.js
        pattern: "登录后查看案例库"
      - type: literal
        file: static/js/templates.js
        pattern: "登录后查看模板库"
      - type: literal
        file: static/js/knowledge-lab.js
        pattern: "登录后查看笔记"
      - type: literal
        file: static/js/app.js
        pattern: "登录后查看项目"

  - id: FIX-2026-08-16-005
    title: "Chat empty state and scroll buttons on empty conversations"
    severity: medium
    rationale: >
      New conversations showed a blank white area with no welcome content, and the
      floating scroll-to-top/bottom buttons appeared even when there was nothing to
      scroll. Fix: chat.js renders a welcome empty-state block when no message groups
      exist, and toggles the .hidden-float class on .float-buttons when the chat area
      has no overflow.
    checks:
      - type: literal
        file: static/js/chat.js
        pattern: "chatEmptyState"
      - type: literal
        file: static/js/chat.js
        pattern: "hidden-float"

  - id: FIX-2026-08-16-006
    title: "No visual role differentiation in the UI header"
    severity: low
    rationale: >
      Regular users, auditors, and admins looked identical in the UI. Fix: app.js
      updateRoleChip() renders a role chip (管理员/审核员/用户) in the header from
      /check_auth data.
    checks:
      - type: literal
        file: static/js/app.js
        pattern: "headerRoleChip"

  - id: FIX-2026-10-05-084
    title: "docker_build: GPU torch index pointed at cu124, which has no torch 2.12.1"
    severity: medium
    rationale: >
      scripts/docker_build.py defaulted the GPU torch index to .../whl/cu124, but
      cu124 only ships torch <=2.6.0 while requirements.txt pins torch==2.12.1 —
      so a GPU build could never resolve and fell back to pip failure. Fix: default
      to cu126 (the lowest index carrying 2.12.1; still supports Turing/sm_75 for
      RTX 20-series). Dockerfile also gained PIP_RETRIES/PIP_TIMEOUT because the
      CUDA wheels (nvidia-cudnn ~700MB) intermittently stall on pypi.nvidia.com.
    checks:
      - type: literal
        file: scripts/docker_build.py
        pattern: 'GPU_INDEX_DEFAULT = "https://download.pytorch.org/whl/cu126"'
      - type: grep_not
        file: scripts/docker_build.py
        pattern: "whl/cu124"
      - type: literal
        file: Dockerfile
        pattern: "ARG PIP_RETRIES=10"

  - id: FIX-2026-10-05-085
    title: "pre-commit hook ran under system Python; false fix regressions"
    severity: medium
    rationale: >
      .githooks/pre-commit dispatches verify_fixes.py via sys.executable, which
      is whatever interpreter git launched the hook with (bare `python` → system
      Python without yaml/dotenv). The script then crashed with ImportError and
      the hook reported 'Fix regression detected', blocking commits for reasons
      unrelated to the fix registry. Fix: re-exec the hook once under
      .venv/Scripts/python.exe (guarded by LOCALAI_HOOK_VENV; no-op without
      .venv so CI is unaffected).
    checks:
      - type: literal
        file: .githooks/pre-commit
        pattern: "def _reexec_with_venv"
      - type: literal
        file: .githooks/pre-commit
        pattern: "os.environ['LOCALAI_HOOK_VENV'] = '1'"

  - id: FIX-2026-10-05-086
    title: ".mcp.json held a plaintext DB password; ignored only by accident"
    severity: medium
    rationale: >
      The project .mcp.json carried the postgres DSN (password inline) and was
      excluded from git only as a side effect of the blanket *.json rule in
      .gitignore — narrowing that rule would have committed the credential.
      Fix: the DSN now comes from the Windows user environment variable
      LOCALAI_PG_DSN. server-postgres reads its DSN only from argv[0], and
      pi-mcp-adapter interpolates env/cwd/url/headers/socket but NOT `args`, so
      the value is expanded by cmd.exe via %LOCALAI_PG_DSN% while the `env`
      block declares the dependency explicitly. .mcp.json is now explicitly
      ignored rather than incidentally covered.
    checks:
      - type: literal
        file: .gitignore
        pattern: ".mcp.json"

  - id: FIX-2026-10-06-QA-031-01
    title: "reasoning_content short-circuit bypassed sanitize_response entirely"
    severity: medium
    rationale: >
      Both store paths for a model reply shortcut to
      `answer = raw_response.strip()` whenever the provider populated
      additional_kwargs['reasoning_content'] — the branch that exists precisely for
      the active OpenRouter/NVIDIA reasoning models. split_thinking_answer (and with
      it sanitize_response) was never called on that branch, so tool-error and
      prompt-template artifacts were persisted and returned verbatim, defeating the
      "stored copy is clean" half of FIX-2026-08-15-001. Fix: run both thinking and
      answer through sanitize_response on that branch too.
    checks:
      - type: literal
        file: app/routes/chat.py
        pattern: "thinking = sanitize_response(reasoning.strip())"
      - type: literal
        file: app/routes/chat_sessions.py
        pattern: "thinking = sanitize_response(reasoning.strip())"
      - type: literal
        file: app/routes/chat.py
        pattern: "answer = sanitize_response(raw_response.strip())"
      - type: literal
        file: app/routes/chat_sessions.py
        pattern: "answer = sanitize_response(raw_response.strip())"
      - type: literal_not
        file: app/routes/chat.py
        pattern: "answer = raw_response.strip() if raw_response else ''"
      - type: literal_not
        file: app/routes/chat_sessions.py
        pattern: "answer = raw_response.strip() if raw_response else ''"

  - id: FIX-2026-10-06-QA-031-02
    title: "falsy-answer fallback re-stored the raw leak sanitize_response had removed"
    severity: medium
    rationale: >
      sanitize_response returns '' when a reply is nothing but a tool-error artifact
      (asserted by test_sanitize_response_strips_invalid_tool_error). Two paths then
      treated '' as "no result" and fell back to the RAW text:
      chat_sessions.regenerate stored and returned `answer if answer else raw_response`,
      and the SSE error path in chat.py used `(answer or full_response)` when saving a
      partial reply. So exactly the case the fix's own test proves it handles was the
      case that re-persisted the leak. Fix: never fall back to the raw response.
    checks:
      - type: literal_not
        file: app/routes/chat_sessions.py
        pattern: "answer if answer else raw_response"
      - type: literal_not
        file: app/routes/chat.py
        pattern: "answer = (answer or full_response)"
      - type: literal
        file: app/routes/chat.py
        pattern: "answer = (answer or '') +"

  - id: FIX-2026-10-06-QA-031-03
    title: "sanitize_response missed spaced tool names; mirror diverged"
    severity: medium
    rationale: >
      The tool-error pattern was
      `Error:[ \t]*\S+[ \t]*is not a valid tool[^\n]*`, whose `\S+` cannot
      span a space. A realistic tool name — "Error: get current date is not a
      tool, try one of [get_date]" — therefore matched nothing, and the whole
      artifact still reached the user and the database, while
      test_sanitize_response_strips_invalid_tool_error stayed green because its
      fixture uses "DesignDesign" (no space). The `[^\n]*` tail also deleted
      legitimate text later on the same line, and `str.strip()` vs `.trim()`
      diverged on \x1c-\x1f / \x85. Fix: the gap is `[^\n\r]{0,80}?`, the
      ", try one of [...]" continuation is optional, and both sides trim one
      explicit shared character set. tests/test_regression.py now executes
      chat.js in node and asserts the front-end and back-end sanitizers agree
      on a payload table, instead of asserting the pattern *strings* exist.
    checks:
      - type: literal
        file: app/utils/helpers.py
        pattern: "is not a valid tool(?:,\\s*try one of"
      - type: literal_not
        file: app/utils/helpers.py
        pattern: "{0,80}?is not a valid tool"
      - type: literal_not
        file: static/js/chat.js
        pattern: "{0,80}?is not a valid tool"
      - type: literal
        file: static/js/chat.js
        pattern: "is not a valid tool(?:,\\s*try one of"
      - type: literal
        file: app/utils/helpers.py
        pattern: "return cleaned.strip(_TRIM_CHARS)"
      - type: literal_not
        file: app/utils/helpers.py
        pattern: "is not a valid tool[^\\n]*"
      - type: literal_not
        file: static/js/chat.js
        pattern: "is not a valid tool[^\\n]*"

  - id: FIX-2026-10-06-QA-031-04
    title: "authenticated fresh tab stayed gated; sessionStorage raced auth"
    severity: high
    rationale: >
      The Round-3 pre-login gates read sessionStorage['username'], which
      verifyAuth only writes after /check_auth resolves, while the loaders
      (cases / templates / notebook / sidebar projects) run at
      DOMContentLoaded. On a fresh tab or after a browser restart with a
      still-valid 30-day cookie, the gates therefore rendered the login
      placeholder and the fetch never fired: nothing re-invoked them, since
      C.refresh and T.refresh had only post-delete call sites. That is a
      regression against the pre-gate behaviour, where the session cookie alone
      was enough. Fix: verifyAuth calls reloadAuthGatedPanels() and
      checkStorage() once auth is known, and knowledge-lab.js exposes
      window._refreshNotebook for that hook.
    checks:
      - type: literal
        file: static/js/app.js
        pattern: "function reloadAuthGatedPanels"
      - type: literal
        file: static/js/app.js
        pattern: "reloadAuthGatedPanels();"
      - type: literal
        file: static/js/knowledge-lab.js
        pattern: "window._refreshNotebook = loadNotebook"
      - type: literal
        file: static/js/app.js
        pattern: "window.Cases.refresh"
      - type: literal
        file: static/js/app.js
        pattern: "window.Templates.refresh"

  - id: FIX-2026-10-06-QA-031-05
    title: "legacy history renderer bypassed the sanitizer"
    severity: medium
    rationale: >
      renderAssistantMessageLegacy renders msg.content and msg.thinking straight
      into the DOM, so assistant rows persisted before FIX-2026-08-15-001 still
      showed tool-error and prompt-template artifacts, and that same raw text
      also reached the /feedback payload. Sanitizing at write time cannot clean
      rows that already exist. Not an XSS issue: the answer path goes through
      _renderMarkdown/_safeHTML (DOMPurify). Fix: sanitize assistantMsg and
      thinking once at the top of the legacy renderer.
    checks:
      - type: literal
        file: static/js/chat.js
        pattern: "assistantMsg = _sanitizeResponse(assistantMsg);"
      - type: literal
        file: static/js/chat.js
        pattern: "thinking = thinking ? _sanitizeResponse(thinking) : thinking;"

  - id: FIX-2026-10-06-QA-031-06
    title: "dev manifest duplicated the test set; counts and refs drifted"
    severity: low
    rationale: >
      requirements-dev.txt was a second, partial copy of the test dependency
      set: it omitted pytest-cov/flask/mock/httpx/xdist and pinned fakeredis
      without the `lua` extra that tests/requirements-test.txt requires, so
      following its own install header produced a broken environment. It now
      includes that file instead of restating it. Also corrected the CHANGELOG
      regression count (13 -> 14 test functions carry the cited FIX ids) and
      refreshed the stale UNRESOLVED-038 line refs (app.js:1307/5968 ->
      app.js:1310/5985).
    checks:
      - type: literal
        file: requirements-dev.txt
        pattern: "-r tests/requirements-test.txt"
      - type: literal
        file: requirements-dev.txt
        pattern: "fakeredis[lua]==2.37.0"
      - type: literal_not
        file: CHANGELOG.md
        pattern: "13 条回归测试"
      - type: literal
        file: data/unresolved.yaml
        pattern: "app.js:1310 / app.js:5985"
