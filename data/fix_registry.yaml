    rationale: >
      request_pin_change_code 在 SMTP 未配置时把 4 位验证码回显在响应 hint（(调试模式) 验证码: {code}）
      并 logger.info 明文，等于第二道锁形同虚设；且无重发冷却。/update_account 用 != 明文比对。
