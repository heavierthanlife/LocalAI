[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -p no:capture -v --tb=short -p no:warnings --strict-markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    e2e: marks tests that need full stack running (deselect with '-m "not e2e"')
    db: marks tests that need database connection
    redis: marks tests needing real Redis (skipped if unavailable)
