# ── Local_AI Production Stack ──
# Start:  docker-compose up -d
# Stop:   docker-compose down
# Logs:   docker-compose logs -f app
# Scale:  docker-compose up -d --scale app=2  (with Redis sessions enabled)
#
# Services:
#   app       — Flask/gunicorn (4 workers, gevent)
#   postgres  — PostgreSQL 16
#   redis     — Redis 7 (ready for Celery + session storage)
#   nginx     — HTTPS reverse proxy

# ── Shared environment for app / celery-worker / celery-beat (FIX-061) ──
# Single source of truth so the three services can never drift apart.
x-app-env: &app-env
  - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
  - ZHIPU_API_KEY=${ZHIPU_API_KEY:-}
  - QWEN_API_KEY=${QWEN_API_KEY:-}
  - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY:-}
  - MIMO_API_KEY=${MIMO_API_KEY:-}
  - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
  - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
  - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
  - BOCHA_API_KEY=${BOCHA_API_KEY:-}
  - DATABASE_URL=postgresql://localai:${DB_PASSWORD:-localai}@postgres:5432/localai
  - REDIS_URL=redis://redis:6379/0
  - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:?FLASK_SECRET_KEY must be set in .env}
  - WTF_CSRF_SECRET_KEY=${WTF_CSRF_SECRET_KEY:?WTF_CSRF_SECRET_KEY must be set in .env}
  - APP_ENV=production
  # ADMIN_PIN must be set in .env — production refuses to start without it
  - ADMIN_PIN=${ADMIN_PIN:-}
  - LLM_TIMEOUT=120
  - WORKERS=4
  # Celery beat owns schedules in Docker; in-process APScheduler would duplicate
  # every job across the 4 gunicorn workers.
  - ENABLE_SCHEDULER=false
  - CREDIT_BROWSER_HEADLESS=true
  # HuggingFace cache → persistent app_data volume (survives recreate; shared by
  # app/worker so sentence-transformers downloads once).
  - HF_HOME=/app/data/hf_cache
  - HF_HUB_DISABLE_SYMLINKS_WARNING=1

services:
  # ── Flask Application ──
  app:
    build: .
    image: local-ai:latest
    container_name: localai-app
    restart: unless-stopped
    environment: *app-env
    volumes:
      # Persistent data — survives container restarts
      - app_data:/app/data
      - app_logs:/app/logs
      # Read-only code asset: industry word tables (baked into image too, but
      # app_data volume would shadow /app/data — bind-mount explicitly)
      - ./data/industry_words:/app/data/industry_words:ro
      # Read-only code asset: built-in laws (seed_laws + extended_laws).
      # /app/data is the app_data volume, which shadows the baked data/laws —
      # without this bind mount the compliance engine loads 0 laws (FIX-058).
      - ./data/laws:/app/data/laws:ro
      # Generic read-only repo-data mount — the seed source for boot-time seeding of
      # mutable assets (app/bootstrap.py::ensure_seeded). data/ is .dockerignore'd.
      - ./data:/app/repo_data:ro
      # Immutable factory preset baseline (restore-to-factory); tracks code → direct mount.
      - ./data/runtime_config_factory.json:/app/data/runtime_config_factory.json:ro
      # Code writes these outside /app/data (BASE_DIR) — without a volume they are
      # lost on --force-recreate (FIX-061). Named volumes keep the original paths.
      - company_kb_files:/app/company_kb_files
      - knowledge_lab_files:/app/knowledge_lab_files
      # EasyOCR models (pre-downloaded on host; avoids re-download at every boot)
      - ${USERPROFILE:-~}/.EasyOCR:/home/localai/.EasyOCR
      # Certificates (for EdgeDriver HTTPS)
      - ./cert:/app/cert:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - localai-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/check_auth', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── PostgreSQL ──
  postgres:
    image: postgres:16-alpine
    container_name: localai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: localai
      POSTGRES_PASSWORD: ${DB_PASSWORD:-localai}
      POSTGRES_DB: localai
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    networks:
      - localai-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localai"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──
  redis:
    image: redis:7-alpine
    container_name: localai-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6380:6379"
    networks:
      - localai-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── Celery Worker (background tasks: OCR, skill extraction) ──
  celery-worker:
    build: .
    image: local-ai:latest
    container_name: localai-celery-worker
    restart: unless-stopped
    command: celery -A celery_app worker -l info -c 1 --max-tasks-per-child 50
    healthcheck:
      disable: true
    environment: *app-env
    volumes:
      - app_data:/app/data
      - app_logs:/app/logs
      - ./data/industry_words:/app/data/industry_words:ro
      # Read-only code asset: built-in laws (seed_laws + extended_laws).
      # /app/data is the app_data volume, which shadows the baked data/laws —
      # without this bind mount the compliance engine loads 0 laws (FIX-058).
      - ./data/laws:/app/data/laws:ro
      # Generic read-only repo-data mount — the seed source for boot-time seeding of
      # mutable assets (app/bootstrap.py::ensure_seeded). data/ is .dockerignore'd.
      - ./data:/app/repo_data:ro
      # Immutable factory preset baseline (restore-to-factory); tracks code → direct mount.
      - ./data/runtime_config_factory.json:/app/data/runtime_config_factory.json:ro
      # Code writes these outside /app/data (BASE_DIR) — without a volume they are
      # lost on --force-recreate (FIX-061). Named volumes keep the original paths.
      - company_kb_files:/app/company_kb_files
      - knowledge_lab_files:/app/knowledge_lab_files
      - ${USERPROFILE:-~}/.EasyOCR:/home/localai/.EasyOCR
      - ./cert:/app/cert:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - localai-net

  # ── Celery Beat (scheduler: replaces APScheduler) ──
  celery-beat:
    build: .
    image: local-ai:latest
    container_name: localai-celery-beat
    restart: unless-stopped
    command: celery -A celery_app beat -l info --schedule=/app/data/celerybeat-schedule
    healthcheck:
      disable: true
    environment: *app-env
    volumes:
      - app_data:/app/data
      - app_logs:/app/logs
      - ./data/industry_words:/app/data/industry_words:ro
      # Read-only code asset: built-in laws (seed_laws + extended_laws).
      # /app/data is the app_data volume, which shadows the baked data/laws —
      # without this bind mount the compliance engine loads 0 laws (FIX-058).
      - ./data/laws:/app/data/laws:ro
      # Generic read-only repo-data mount — the seed source for boot-time seeding of
      # mutable assets (app/bootstrap.py::ensure_seeded). data/ is .dockerignore'd.
      - ./data:/app/repo_data:ro
      # Immutable factory preset baseline (restore-to-factory); tracks code → direct mount.
      - ./data/runtime_config_factory.json:/app/data/runtime_config_factory.json:ro
      # Code writes these outside /app/data (BASE_DIR) — without a volume they are
      # lost on --force-recreate (FIX-061). Named volumes keep the original paths.
      - company_kb_files:/app/company_kb_files
      - knowledge_lab_files:/app/knowledge_lab_files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - localai-net

  # ── Nginx (HTTPS termination) ──
  nginx:
    image: nginx:alpine
    container_name: localai-nginx
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./cert:/etc/nginx/certs:ro
      - ./static:/app/static:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
    networks:
      - localai-net
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

# ── Persistent Volumes ──
volumes:
  app_data:     # uploaded files, knowledge base, search cache
  app_logs:     # application logs
  pg_data:      # PostgreSQL data
  redis_data:   # Redis AOF persistence
  company_kb_files:    # 企业知识库上传件（/app/company_kb_files，FIX-061）
  knowledge_lab_files: # 知识实验室上传件（/app/knowledge_lab_files，FIX-061）

# ── Network ──
networks:
  localai-net:
    driver: bridge
